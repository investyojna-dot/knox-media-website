<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <!-- Left Squircle Badge with Cutout 'K' -->
  <g id="SecondaryBadgeK" transform="translate(30, 25)">
    <!-- Main Badge Shape (Royal Purple & Sky Blue Gradient) -->
    <defs>
      <linearGradient id="secBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2E1065" />
        <stop offset="100%" stop-color="#0284C7" />
      </linearGradient>
    </defs>
    
    <path d="M 50 0 H 135 C 145 0, 150 5, 150 15 V 135 C 150 145, 145 150, 135 150 H 15 C 5 150, 0 145, 0 135 V 50 C 0 20, 20 0, 50 0 Z" fill="url(#secBadgeGrad)" />
    
    <!-- Cutout Letter 'K' inside badge -->
    <path d="M 38 30 H 62 V 68 L 98 30 H 125 L 82 75 L 128 120 H 100 L 62 82 V 120 H 38 Z" fill="#FFFFFF" />
    <!-- Electric Cyan Shadow Edge -->
    <path d="M 62 68 L 98 30 H 104 L 68 74 Z" fill="#06B6D4" />
  </g>

  <!-- Right Stacked Typography -->
  <!-- Top Line: KNOX -->
  <text x="210" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="68" font-weight="900" fill="#2E1065" letter-spacing="4">KNOX</text>
  
  <!-- Bottom Line: MEDIA -->
  <text x="210" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="400" fill="#0284C7" letter-spacing="8">MEDIA</text>
</svg>
