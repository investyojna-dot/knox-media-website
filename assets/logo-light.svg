<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 240" width="100%" height="100%">
  <defs>
    <linearGradient id="growthGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B1869" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pinkGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="cyanGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <g id="KnoxWebsiteLogoLight">
    <!-- Left Icon Mark: Digital Marketing Symbol -->
    <g transform="translate(100, 115)">
      <!-- Target Arc Ring -->
      <path d="M -70 10 A 70 70 0 1 1 50 -50" fill="none" stroke="url(#pinkGradLight)" stroke-width="14" stroke-linecap="round" />
      
      <!-- Upward Growth Arrow ↗️ -->
      <path d="M -80 50 L 50 -70 L 30 -70 M 50 -70 L 50 -50" fill="none" stroke="url(#growthGradLight)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
      <polygon points="50,-85 75,-40 30,-45" fill="#2563EB" />

      <!-- Top Chat Speech Bubble 💬 -->
      <g transform="translate(10, -85)">
        <path d="M 0 0 C 15 -15 45 -15 55 0 C 65 15 50 35 30 35 L 15 45 L 20 32 C 5 30 -5 15 0 0 Z" fill="#9333EA" />
        <line x1="15" y1="12" x2="40" y2="12" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
        <line x1="15" y1="20" x2="32" y2="20" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
      </g>

      <!-- Center Play Triangle ▶️ -->
      <polygon points="-10,-35 20,-18 -10,-1" fill="#06B6D4" />

      <!-- Floating Social Elements -->
      <circle cx="-65" cy="-20" r="10" fill="#F43F5E" />
      <circle cx="65" cy="15" r="14" fill="#F59E0B" />
    </g>

    <!-- Right Typography: KNOX MEDIA Wordmark -->
    <g transform="translate(240, 20)">
      <!-- KNOX (Deep Indigo Purple) -->
      <g fill="#2E1065">
        <!-- K -->
        <path d="M 20 20 H 48 V 65 L 85 20 H 122 L 70 75 L 128 130 H 90 L 48 85 V 130 H 20 Z" />

        <!-- N -->
        <path d="M 145 20 H 175 L 222 90 V 20 H 250 V 130 H 222 L 175 60 V 130 H 145 Z" />

        <!-- O (With Play Triangle Cutout) -->
        <g transform="translate(318, 75)">
          <circle cx="0" cy="0" r="52" fill="#2E1065" />
          <circle cx="0" cy="0" r="26" fill="#FFFFFF" />
          <polygon points="-7,-15 15,0 -7,15" fill="#2E1065" />
        </g>

        <!-- X -->
        <path d="M 388 20 H 420 L 458 70 L 495 20 H 528 L 480 75 L 532 130 H 498 L 458 80 L 416 130 H 384 L 436 75 Z" />
      </g>

      <!-- MEDIA (Electric Cyan Blue) -->
      <g fill="url(#cyanGradLight)">
        <text x="550" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="400" letter-spacing="4">MEDIA</text>
      </g>

      <!-- Tagline: DIGITAL MARKETING AGENCY -->
      <g transform="translate(20, 160)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#2E1065" letter-spacing="8">DIGITAL MARKETING AGENCY</text>
      </g>
    </g>
  </g>
</svg>
